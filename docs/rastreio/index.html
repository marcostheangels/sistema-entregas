<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreio — ConectaEntregas</title>
<link rel="icon" type="image/png" href="../logo-192.png">
<link rel="stylesheet" href="leaflet.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    background-image: radial-gradient(900px 420px at 85% -10%, rgba(99, 102, 241, 0.2), transparent 60%);
  }
  .topo {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    background: rgba(30, 41, 59, 0.9);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .topo img { width: 34px; height: 34px; border-radius: 8px; }
  .topo strong { font-size: 1rem; letter-spacing: 0.03em; }
  .topo span { font-size: 0.72rem; color: #94a3b8; display: block; }
  .caixa { max-width: 520px; margin: 0 auto; padding: 18px; }
  .status-card {
    background: #1e293b; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 18px; margin-bottom: 14px;
  }
  .status-grande { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .bolinha { width: 12px; height: 12px; border-radius: 50%; background: #64748b; flex: none; }
  .bolinha.ativa { background: #10b981; box-shadow: 0 0 0 5px rgba(16,185,129,0.18); animation: pulsa 1.5s infinite; }
  @keyframes pulsa { 50% { box-shadow: 0 0 0 9px rgba(16,185,129,0); } }
  .sub { color: #94a3b8; font-size: 0.85rem; margin-top: 6px; line-height: 1.5; }
  .passos { list-style: none; margin-top: 12px; }
  .passos li { padding: 7px 0; font-size: 0.86rem; color: #64748b; display: flex; gap: 9px; align-items: center; }
  .passos li.fei { color: #34d399; }
  .passos li.atu { color: #34d399; font-weight: 700; }
  .passos li.atu .passo-ico { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; background: #10b981; color: #04250f; font-size: 11px; font-weight: 900; align-items: center; justify-content: center; animation: pulsaico 1.2s ease-in-out infinite; }
  .passos li.fut { color: #475569; }
  @keyframes pulsaico { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  .mapa { height: 320px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 14px; }
  #map { height: 100%; }
  .erro { text-align: center; padding: 60px 20px; }
  .erro h1 { font-size: 1.3rem; margin-bottom: 8px; }
  .erro p { color: #94a3b8; font-size: 0.9rem; }
  .codigo-box {
    display: none;
    background: rgba(245, 158, 11, 0.12); border: 1px dashed rgba(245,158,11,0.5);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; text-align: center;
  }
  .codigo-box strong { font-size: 1.5rem; letter-spacing: 0.35em; color: #fbbf24; font-family: monospace; }
  .codigo-box small { display: block; color: #94a3b8; margin-top: 4px; font-size: 0.72rem; }
  .atualizado { text-align: center; color: #475569; font-size: 0.7rem; margin-top: 10px; }
</style>
</head>
<body>
  <div class="topo">
    <img src="../logo-192.png" alt="">
    <div><strong>CONECTAENTREGAS</strong><span>Rastreamento de pedido</span></div>
  </div>
  <div class="caixa" id="conteudo">
    <div class="erro"><h1>⏳ Carregando pedido...</h1></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="leaflet.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDY7Ea1B6ofAHSmFyyXPnUp9SdebZbF1EU",
      databaseURL: "https://entregadores-e-empresas-default-rtdb.firebaseio.com",
      projectId: "entregadores-e-empresas"
    });

    const PASSOS = [
      { k: 'pendente',    t: '🕐 Pedido criado — aguardando motoboy' },
      { k: 'aceite',      t: '✅ Motoboy aceitou o pedido' },
      { k: 'em_transito', t: '🛵 Saiu para entrega' },
      { k: 'entregue',    t: '📦 Entregue! Bom apetite / obrigado!' }
    ];

    // Mostra o erro real em vez da tela generica (facilita diagnosticar)
    window.addEventListener('error', ev => {
      console.error('Erro capturado:', ev.message, ev.filename, ev.lineno);
    });

    const id = new URLSearchParams(location.search).get('pedido');
    const caixa = document.getElementById('conteudo');
    // Estado em escopo global do script: desenhar()/observarMapa() rodam fora do bloco else
    let db = null, mapa = null, marcadorEntregador = null, marcadorDestino = null;
    let entregaAtual = null;
    let unsubPosicao = null;
    let ultimaPos = null;
    let usuarioMexeu = false;
    if (!id) { caixa.innerHTML = '<div class="erro"><h1>🔗 Link inválido</h1><p>Peça o link de rastreio correto à empresa.</p></div>'; }
    else {
      db = firebase.database();

      function vigiarPosicao(uid) {
        if (!uid || !db) return;
        if (unsubPosicao) { db.ref('posicoes/' + unsubPosicao).off('value'); unsubPosicao = null; }
        unsubPosicao = uid;
        db.ref('posicoes/' + uid).on('value', sp => {
          const p = sp.val();
          if (!p || !mapa) return;
          const online = p.online === true && (Date.now() - (p.timestamp || 0)) < 120000;
          if (!online) return;
          atualizarMarcadorEntregador(p.lat, p.lng);
        });
      }

      function atualizarMarcadorEntregador(lat, lng) {
        if (!mapa || typeof lat !== 'number' || typeof lng !== 'number') return;
        ultimaPos = { lat, lng };
        if (!marcadorEntregador) {
          const icone = L.divIcon({ html: '<div style="font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">🛵</div>', className: '', iconSize: [34, 34], iconAnchor: [17, 17] });
          marcadorEntregador = L.marker([lat, lng], { icon: icone }).addTo(mapa);
          if (!usuarioMexeu) mapa.setView([lat, lng], 15);
        } else {
          marcadorEntregador.setLatLng([lat, lng]);
          mapa.panTo([lat, lng]);
        }
      }

      // Tenta a fonte primaria (entregas/{id}); se nao existir ou nao tiver permissao, usa o espelho publico (rastreio/{id})
      // Fallback final: REST API direta (funciona mesmo se o SDK do Firebase falhar por rede/websocket)
      async function buscarREST(caminho) {
        const resp = await fetch(`https://entregadores-e-empresas-default-rtdb.firebaseio.com/${caminho}.json`);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
      }
      function carregarEntrega() {
        return db.ref('entregas/' + id).once('value').then(s => {
          const e = s.val();
          if (e) return { fonte: 'entregas', ...e };
          return db.ref('rastreio/' + id).once('value').then(rs => {
            const r = rs.val();
            if (!r) return null;
            return { fonte: 'rastreio', ...r };
          });
        }).catch(async () => {
          // Sem permissao para entregas: usa o espelho publico; se o SDK falhar, tenta REST
          try {
            const r = await buscarREST('rastreio/' + id);
            if (!r) return null;
            return { fonte: 'rastreio', ...r };
          } catch { return null; }
        });
      }

      carregarEntrega().then(d => {
        if (!d) { caixa.innerHTML = '<div class="erro"><h1>🔍 Pedido não encontrado</h1><p>Confira o link com a empresa.</p></div>'; return; }
        entregaAtual = d;
        desenhar(d);
        observarMapa();
        // Posicao em tempo real: prioriza posicoes/{entregadorId}; senao usa o espelho rastreio/{id}
        if (d.entregadorId) {
          vigiarPosicao(d.entregadorId);
          db.ref('entregas/' + id + '/entregadorId').on('value', s2 => vigiarPosicao(s2.val()));
        }
        // Espelho publico: escuta lat/lng diretamente (funciona mesmo sem regras novas)
        db.ref('rastreio/' + id).on('value', rs2 => {
          const r = rs2.val();
          if (r && r.lat != null && r.lng != null) atualizarMarcadorEntregador(r.lat, r.lng);
          if (r && r.status && entregaAtual && entregaAtual.status !== r.status) {
            entregaAtual = { ...entregaAtual, ...r };
            desenhar(entregaAtual);
          }
        });
      }).catch(err => {
        console.error('Erro ao carregar rastreio:', err);
        caixa.innerHTML = '<div class="erro"><h1>⏳ Conexão lenta — tentando carregar...</h1></div>';
        // Ultimo recurso: carrega via REST sem depender do SDK
        buscarREST('rastreio/' + id).then(r => {
          if (!r) { caixa.innerHTML = '<div class="erro"><h1>🔍 Pedido não encontrado</h1><p>Confira o link com a empresa.</p></div>'; return; }
          entregaAtual = { fonte: 'rastreio', ...r };
          desenhar(entregaAtual);
          observarMapa();
          if (r.entregadorId) vigiarPosicao(r.entregadorId);
          // Polling leve via REST a cada 15s (sem SDK)
          setInterval(() => {
            buscarREST('rastreio/' + id).then(r2 => {
              if (!r2) return;
              if (r2.lat != null && r2.lng != null) atualizarMarcadorEntregador(r2.lat, r2.lng);
              if (r2.status && entregaAtual && entregaAtual.status !== r2.status) {
                entregaAtual = { ...entregaAtual, ...r2 };
                desenhar(entregaAtual);
              }
            }).catch(() => {});
          }, 15000);
        }).catch(() => {});
      });
    }

    function desenhar(d) {
      const i = PASSOS.findIndex(p => p.k === d.status);
      const nomeStatus = d.status === 'cancelado' ? 'Pedido cancelado' : (i >= 0 ? PASSOS[i].t.replace(/^[^\s]+\s/, '') : d.status);
      const corBola = d.status === 'entregue' ? '#10b981' : (d.status === 'pendente' ? '#f59e0b' : (d.status === 'cancelado' ? '#ef4444' : '#6366f1'));
      const destaque = d.status === 'entregue'
        ? 'Seu pedido foi entregue. Obrigado!'
        : (d.status === 'cancelado'
          ? 'Este pedido foi cancelado. Fale com a empresa em caso de dúvidas.'
          : (d.status === 'em_transito'
          ? 'Seu pedido está a caminho! Acompanhe a moto no mapa.'
          : (d.status === 'aceite' ? 'O entregador aceitou e está indo buscar o pedido.' : 'Estamos localizando um entregador para você.')));

      const entregadorNome = d.entregadorNome || (d.entregador && d.entregador.nome) || null;
      const infoEntregador = entregadorNome
        ? `<p class="sub" style="margin-top:10px">👤 Entregador: <strong>${escapar(entregadorNome)}</strong></p>`
        : '';

      caixa.innerHTML = `
        <div class="status-card">
          <div class="status-grande"><span class="bolinha ${d.status === 'entregue' ? 'ativa' : ''}" style="background:${corBola}"></span>${nomeStatus.toUpperCase()}</div>
          <p class="sub">${destaque}</p>
          ${infoEntregador}
          ${d.status === 'cancelado' ? '' : `<ul class="passos">
            ${PASSOS.map((p, j) => {
              const txt = p.t.replace(/^[^\s]+\s/, '');
              if (j < i) return `<li class="fei">✔ ${txt}</li>`;
              if (j === i) return `<li class="atu"><span class="passo-ico">✔</span> ${txt}</li>`;
              return `<li class="fut">· ${txt}</li>`;
            }).join('')}
          </ul>`}
        </div>
        <div class="mapa"><div id="map"></div></div>
        <div class="atualizado">Atualizado ${new Date().toLocaleTimeString('pt-BR')} · ConectaEntregas</div>
      `;

      // O innerHTML acima destruiu o #map antigo: recria o Leaflet do zero
      // (reusar o objeto antigo o deixava preso ao elemento removido = mapa em branco)
      if (mapa) { try { mapa.remove(); } catch { /* ja removido */ } mapa = null; }
      marcadorEntregador = null;
      marcadorDestino = null;
      mapa = L.map('map', { zoomControl: false }).setView([-16.73, -43.86], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapa);
      observarMapa();
      setTimeout(() => { try { mapa.invalidateSize(); } catch { /* mapa removido */ } }, 50);
      // Restaura a ultima posicao conhecida da moto no mapa novo
      if (ultimaPos) atualizarMarcadorEntregador(ultimaPos.lat, ultimaPos.lng);

      const destinoLat = d.destinoLat || d.destino?.lat;
      const destinoLng = d.destinoLng || d.destino?.lng;
      if (destinoLat && destinoLng) {
        if (marcadorDestino) marcadorDestino.setLatLng([destinoLat, destinoLng]);
        else {
          const icone = L.divIcon({ html: '<div style="font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">🏠</div>', className: '', iconSize: [34, 34], iconAnchor: [17, 34] });
          marcadorDestino = L.marker([destinoLat, destinoLng], { icon: icone }).addTo(mapa).bindPopup('Endereço de entrega');
        }
      }

      // Só centraliza no destino automaticamente se ainda não temos posição do entregador e o usuario nao mexeu
      if (destinoLat && destinoLng && !marcadorEntregador && !usuarioMexeu) {
        mapa.setView([destinoLat, destinoLng], 14);
      }
    }

    // Detecta quando o usuario move o mapa para nao roubar o controle
    function observarMapa() {
      if (!mapa) return;
      mapa.on('dragstart zoomstart', () => { usuarioMexeu = true; });
    }

    function escapar(t) {
      const div = document.createElement('div'); div.textContent = String(t || ''); return div.innerHTML;
    }
  </script>
</body>
</html>
